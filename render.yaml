services:
  - type: web
    name: n8n
    runtime: image
    plan: free
    image:
      url: docker.io/n8nio/n8n:1.80.0
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
